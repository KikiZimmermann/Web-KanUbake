<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In</title>
    <link rel="stylesheet" href="../css/logInSingUp.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/transition-between-pages.css">
  </head>
  <body>
    <a href="../../index/index.html" title="Go to Home Page">
      <img
        class="hompage-btn btn"
        src="../../img/logos/home-icon-silhouette-svgrepo-com.svg"
        alt="Back To Homepage"
      />
    </a>

    <section class="card">
      <form autocomplete="off" action="" class="form_basic">
        <nav class="nav-btn">
          <a class="btn" href="#log_in">Log In</a>
          <a class="btn btn-disabled" href="./SignUp.html">Sign Up</a>
        </nav>

        <header>
          <h1>Welcome Back</h1>
          <p>Login to access your account</p>
        </header>

        <label for="login_email" class="lbl">
          Email
          <input id="login_email" type="email" />
          <p></p>
        </label>

        <label for="login_pass" class="lbl">
          Password
          <input id="login_pass" type="password" />
          <p></p>
        </label>

        <button type="button" id="log_in" class="btn">Log In</button>
      </form>
    </section>
    <script src="../js/transition-between-pages.js"></script>
  </body>
</html>

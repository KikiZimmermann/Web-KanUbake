<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <main class="auth-wrapper">
    <section class="auth-card" aria-label="Authentication form">

      <nav class="tab-switcher" role="tablist" aria-label="Auth method">
        <button id="btn-login" class="tab-btn active" role="tab"
          aria-selected="true" aria-controls="panel-login" type="button">
          Log In
        </button>

        <button id="btn-signup" class="tab-btn" role="tab"
          aria-selected="false" aria-controls="panel-signup" type="button">
          Sign Up
        </button>
      </nav>

      <section id="panel-login" class="panel active" role="tabpanel" aria-labelledby="btn-login">
        <header class="auth-header">
          <h1>Welcome Back</h1>
          <p>Login to access your account</p>
        </header>

        <form class="auth-form" novalidate>
          <fieldset class="field-group">
            <label for="login-email">Email</label>
            <input  maxlength="50" required id="login-email" type="email" name="email"
              placeholder="you@example.com" autocomplete="email" />
            <small class="error-msg"></small>
          </fieldset>

          <fieldset class="field-group">
            <label for="login-password">Password</label>
            <div class="input-wrap">
              <input  maxlength="30" required id="login-password" type="password" name="password"
                placeholder="••••••••" autocomplete="current-password" />

              <button type="button" class="toggle-pw" aria-label="Show password" data-target="login-password">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>

                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
            <small class="error-msg"></small>
          </fieldset>

          <button type="submit" class="btn-primary">Log In</button>
        </form>
      </section>

      <section id="panel-signup" class="panel" role="tabpanel" aria-labelledby="btn-signup" hidden>
        <header class="auth-header">
          <h1>Get Started Now</h1>
          <p>Create an account to explore our app</p>
        </header>

        <form class="auth-form" novalidate>
          <section class="row-2" aria-label="Full name">
            <fieldset class="field-group">
              <label for="signup-firstname">First Name</label>
              <input maxlength="50" required id="signup-firstname" type="text" name="firstname"
                placeholder="Max" autocomplete="given-name" />
              <small class="error-msg"></small>
            </fieldset>

            <fieldset class="field-group">
              <label for="signup-lastname">Last Name</label>
              <input maxlength="50" required id="signup-lastname" type="text" name="lastname"
                placeholder="Musterman" autocomplete="family-name" />
              <small class="error-msg"></small>
            </fieldset>
          </section>

          <fieldset class="field-group">
            <label for="signup-email">Email</label>
            <input maxlength="50" required id="signup-email" type="email" name="email"
              placeholder="you@example.com" autocomplete="email" />
            <small class="error-msg"></small>
          </fieldset>

          <fieldset class="field-group">
            <label for="signup-dob">Date of Birth</label>
            <input maxlength="50" required id="signup-dob" type="date" name="dob" autocomplete="bday" />
            <small class="error-msg"></small>
          </fieldset>

          <fieldset class="field-group">
            <label for="signup-password">Password</label>
            <div class="input-wrap">
              <input maxlength="30" required id="signup-password" type="password" name="password"
                placeholder="••••••••" autocomplete="new-password" />

              <button type="button" class="toggle-pw" aria-label="Show password" data-target="signup-password">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>

                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
            <small class="error-msg"></small>
          </fieldset>

          <fieldset class="field-group">
            <label for="signup-confirm-password">Confirm Password</label>
            <div class="input-wrap">
              <input
                required maxlength="30"
                id="signup-confirm-password"
                type="password"
                name="confirm-password"
                placeholder="••••••••"
              />
            </div>
            <small class="error-msg"></small>
          </fieldset>

          <button type="submit" class="btn-primary">Sign Up</button>
        </form>
      </section>

    </section>
  </main>

<!-- Load model first so login.js can use its functions -->
<script src="authModel.js"></script>
<script src="login.js"></script>
</body>
</html>
